<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PPG PWA Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #06121c 0%, #0f172a 100%);
      color: #e2e8f0;
    }

    main {
      width: min(28rem, calc(100vw - 2rem));
      padding: 2rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 1rem;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
    }

    p {
      margin: 0.5rem 0;
      line-height: 1.5;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main>
    <h1>Offline mode is ready</h1>
    <p>The app shell is available without internet.</p>
    <p>If a model or camera asset was not opened online yet, reconnect once so it can be cached locally.</p>
  </main>
</body>
</html>
